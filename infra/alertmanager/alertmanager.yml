# Alertmanager — routage des alertes vers le moteur de remédiation.
# Authentification par bearer token : Alertmanager ne lit pas les variables
# d'environnement, le token est fourni par le secret Compose remediation_bearer_token
# (alimenté par REMEDIATION_BEARER_TOKEN dans .env).

route:
  receiver: remediation-engine
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: remediation-engine
    webhook_configs:
      - url: http://remediation-engine:8000/webhook/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/remediation_bearer_token
