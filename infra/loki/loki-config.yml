# Loki - journaux centralisés, mode binaire unique, stockage sur disque.
# Les données sont dans le volume loki-data (/loki). Rétention : 7 jours.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Ruler : évalue les règles SOC (security/soc-rules/) sur les logs et envoie les
# alertes à Alertmanager. Tenant unique "fake" (auth_enabled: false).
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki-ruler
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  evaluation_interval: 15s
  poll_interval: 1m

analytics:
  reporting_enabled: false
