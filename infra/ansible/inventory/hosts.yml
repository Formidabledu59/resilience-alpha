# Inventaire Ansible : tout s'exécute en local, soit dans le conteneur
# remediation-engine, soit depuis WSL2 pour le déploiement initial.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    # Valeurs partagées par les playbooks (noms de CLAUDE.md, projet Compose "resilience-alpha")
    compose_project: resilience-alpha
    docker_api_url: http://socket-proxy-rw:2375
    waf_container: resilience-alpha-waf-1
    waf_banlist_dir: /banlist
    prometheus_url: http://prometheus:9090
    canary_url: http://canary:8000
