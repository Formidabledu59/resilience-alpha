# Configuration Ansible du projet.
#
# Sous WSL, /mnt/d est accessible en écriture à tous : Ansible IGNORE alors un
# ansible.cfg trouvé dans le dossier courant. Toujours le désigner explicitement :
#   export ANSIBLE_CONFIG=infra/ansible/ansible.cfg
# Dans le conteneur remediation-engine, ANSIBLE_CONFIG=/ansible/ansible.cfg est
# défini par docker-compose.yml.

[defaults]
# Chemin relatif à ce fichier
inventory = inventory/hosts.yml
retry_files_enabled = False
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
