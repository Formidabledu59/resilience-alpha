# Bannit des adresses IP au WAF, puis recharge le WAF à chaud (signal HUP, sans coupure).
# Exécuté par remediation-engine (conteneur), qui gère aussi la levée du ban (unban_ip.yml).
# Contrat : docs/architecture/contracts.md, section "WAF : bannissement".
#
# Variables attendues (passées par -e) :
#   incident_id   identifiant de l'incident (nom du fichier de ban)
#   ban_ips       liste d'adresses IP à bannir
#   ban_minutes   durée du ban, pour le commentaire (défaut 5)
- name: Bannir des adresses IP au WAF
  hosts: localhost
  gather_facts: false
  vars:
    ban_minutes: 5
    ban_file: "{{ waf_banlist_dir }}/incident-{{ incident_id }}.conf"
  tasks:
    - name: Vérifier les paramètres (identifiant contrôlé, adresses IPv4 valides)
      ansible.builtin.assert:
        that:
          - incident_id is match('^inc-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}$')
          - ban_ips | length > 0
          - ban_ips | select('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}$') | list | length == ban_ips | length
        fail_msg: "Paramètres invalides : incident_id ou ban_ips"

    - name: Écrire le fichier de ban dans le volume waf-banlist
      ansible.builtin.copy:
        dest: "{{ ban_file }}"
        mode: "0644"
        content: |
          # Ban automatique, incident {{ incident_id }}, durée {{ ban_minutes }} minutes
          {% for ip in ban_ips %}
          deny {{ ip }};
          {% endfor %}

    - name: Recharger le WAF à chaud (HUP via socket-proxy-rw)
      ansible.builtin.uri:
        url: "{{ docker_api_url }}/containers/{{ waf_container }}/kill?signal=HUP"
        method: POST
        status_code: 204

    - name: Résultat
      ansible.builtin.debug:
        msg: "RESULT: {{ ban_ips | join(', ') }} bannie(s) au WAF pour {{ ban_minutes }} minutes"
