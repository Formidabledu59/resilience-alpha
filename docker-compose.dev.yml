# Surcharge de DÉVELOPPEMENT uniquement : jamais pendant la démonstration.
#
# Tant que le WAF n'est pas configuré, le frontal n'est joignable que sur app-net
# (réseau interne). Ce fichier le publie sur 127.0.0.1:8081 (PC Hôte seulement,
# jamais sur le réseau) pour pouvoir l'ouvrir dans un navigateur :
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build frontend
#   puis http://127.0.0.1:8081
#
# En démonstration, le frontal n'est accessible qu'à travers le WAF (192.168.137.1:80).

services:
  frontend:
    ports:
      - "127.0.0.1:8081:8080"
    networks: [app-net, ui-net]   # un réseau bridge est nécessaire pour publier un port
