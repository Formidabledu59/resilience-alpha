# WAF : nginx + ModSecurity v3 + OWASP Core Rule Set (image owasp/modsecurity-crs).
#
# Ce fichier est monté comme template : au démarrage, l'image remplace les ${VAR}
# par les variables d'environnement définies dans docker-compose.yml. Les $var en
# minuscules sont des variables nginx et ne sont pas touchées.
#
# ModSecurity est activé au niveau http par l'image (conf.d/modsecurity.conf) :
# toute requête qui passe ici est inspectée par le Core Rule Set avant d'être relayée.

# --- Rate-limit par client ----------------------------------------------------
# Réglable sans toucher au fichier (WAF_RATE_LIMIT, WAF_RATE_BURST dans .env).
limit_req_zone $binary_remote_addr zone=waf_global:10m rate=${WAF_RATE_LIMIT};
limit_req_status 429;

# --- Journal d'accès JSON (lu par Alloy, stocké 7 jours dans Loki) -------------
# Contrairement au frontal, le WAF journalise l'IP du client : c'est un journal de
# sécurité (détection et blocage des attaques), voir la page Confidentialité.
log_format waf_json escape=json
  '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method","path":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
  '"upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';

server_tokens off;

server {
  listen ${PORT} default_server;
  server_name ${SERVER_NAME};
  access_log /dev/stdout waf_json;
  client_max_body_size 64k;

  # DNS Docker résolu à chaque requête : le WAF suit le frontal même s'il redémarre
  resolver 127.0.0.11 valid=10s ipv6=off;

  # --- Liste de bannissement ---------------------------------------------------
  # Fichiers *.conf écrits par remediation-engine dans le volume waf-banlist
  # (lignes "deny <ip>;"), pris en compte au rechargement du WAF (signal HUP).
  # Aucun fichier = aucun ban : l'include d'un motif sans correspondance est valide.
  include /etc/nginx/banlist/*.conf;

  location / {
    limit_req zone=waf_global burst=${WAF_RATE_BURST} nodelay;

    # Un seul backend : le frontal, dont le nginx relaie /api vers les services
    set $frontend_host frontend;
    proxy_pass http://$frontend_host:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  # Fourni par l'image : /healthz (healthcheck), /metrics/nginx (local uniquement), page 50x
  include includes/location_common.conf;
}
