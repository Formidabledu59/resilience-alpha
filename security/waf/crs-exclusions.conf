# Exclusions du Core Rule Set, propres à Resilience Alpha.
# Monté comme RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf : chargé APRÈS les règles,
# condition pour que SecRuleRemoveById les trouve.
#
# Règle : chaque exclusion est justifiée ici. Une exclusion non expliquée est une faille.

# 920350 "Host header is a numeric IP address" (score 3).
# Le démonstrateur n'a pas de nom de domaine : il est appelé par son IP
# (http://192.168.137.1, healthcheck sur 127.0.0.1). Sans cette exclusion, CHAQUE
# requête légitime prendrait 3 points d'anomalie sur les 5 qui déclenchent le blocage,
# et le SOC serait noyé d'alertes sans valeur.
SecRuleRemoveById 920350
