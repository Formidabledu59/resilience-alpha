name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tout l'historique : un secret supprimé reste dans Git
      - name: Installer gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scanner l'historique
        run: ./gitleaks git --redact --verbose .

  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - name: yamllint
        run: |
          yamllint -s -d "{extends: default, ignore-from-file: .gitignore, rules: {
            document-start: disable,
            line-length: {max: 160},
            truthy: {check-keys: false},
            comments: {min-spaces-from-content: 1}}}" .

  pytest:
    name: Tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: pytest par service
        # Chaque dossier contenant tests/ est testé séparément (dépendances propres).
        # Code 5 = aucun test collecté : toléré tant que les services sont en cours d'écriture.
        run: |
          status=0
          for dir in $(find services ml assistant-rag -type d -name tests -not -path '*/node_modules/*' | xargs -r -n1 dirname | sort -u); do
            echo "::group::pytest $dir"
            if [ -s "$dir/requirements.txt" ]; then pip install -r "$dir/requirements.txt"; fi
            rc=0
            (cd "$dir" && python -m pytest) || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 5 ]; then
              echo "::warning::$dir : aucun test collecté"
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$dir : pytest a échoué (code $rc)"
              status=1
            fi
          done
          exit $status
