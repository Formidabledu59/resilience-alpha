; ESP8266 - indicateur d'état de l'authentification biométrique (LED bicolore).
; IDE : JetBrains CLion + PlatformIO (consigne). Carte NodeMCU v2 (ESP-12E) par défaut.
;
; Avant de flasher : copier include/secrets.h.example en include/secrets.h et y mettre
; le SSID, le mot de passe WiFi et l'URL de la passerelle. secrets.h est ignoré par Git.

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.2.0
