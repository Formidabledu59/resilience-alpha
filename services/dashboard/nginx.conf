# nginx du dashboard de supervision (publié sur 127.0.0.1:5173 uniquement).
# Sert le build React et relaie un nombre limité d'appels, en lecture seule sauf la
# transaction de contrôle du canary. Aucun accès direct à Docker, Vault ou aux secrets.

limit_req_zone $binary_remote_addr zone=probe:1m rate=6r/m;
limit_req_status 429;

log_format resilience_json escape=json
  '{"time":"$time_iso8601","method":"$request_method","path":"$request_uri","status":$status,"duration":$request_time}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1k;
  access_log /dev/stdout resilience_json;

  # DNS Docker résolu à chaque requête : nginx démarre même si un service n'existe pas encore
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  proxy_connect_timeout 3s;
  proxy_read_timeout 10s;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # --- Prometheus : uniquement les deux endpoints de requête, en GET -----------
  location = /api/prometheus/query {
    access_log off;
    limit_except GET { deny all; }
    set $prometheus_host prometheus;
    proxy_pass http://$prometheus_host:9090/api/v1/query$is_args$args;
  }

  location = /api/prometheus/query_range {
    access_log off;
    limit_except GET { deny all; }
    set $prometheus_host prometheus;
    proxy_pass http://$prometheus_host:9090/api/v1/query_range$is_args$args;
  }

  # --- Canary : transaction de contrôle (le seul appel qui agit) --------------
  location = /api/canary/probe {
    limit_req zone=probe burst=2 nodelay;
    limit_except POST { deny all; }
    set $canary_host canary;
    proxy_pass http://$canary_host:8000/probe;
  }

  # --- Remédiation : lecture des incidents ------------------------------------
  location = /api/remediation/incidents {
    access_log off;
    limit_except GET { deny all; }
    set $remediation_host remediation-engine;
    proxy_pass http://$remediation_host:8000/incidents$is_args$args;
  }

  location /api/ {
    return 404;
  }

  location = / {
    expires -1;
    try_files /index.html =404;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    expires -1;
  }
}
