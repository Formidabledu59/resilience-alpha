# nginx du frontal : sert le build React et relaie /api/* vers les services.
# Image nginx-unprivileged : utilisateur 101, écoute sur 8080, fichiers temporaires dans /tmp.

# Anti-abus : limites par client (complète le rate-limit du WAF).
# Quand le WAF sera devant, utiliser l'en-tête X-Forwarded-For (module realip) comme clé.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

# Mesure d'audience anonyme : journal JSON sans adresse IP, lu par Alloy puis Loki
log_format resilience_json escape=json
  '{"time":"$time_iso8601","method":"$request_method","path":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 16k;
  access_log /dev/stdout resilience_json;

  # DNS Docker résolu à chaque requête : nginx démarre même si un service n'est pas encore là
  resolver 127.0.0.11 valid=10s ipv6=off;

  # IP réelle du client, transmise par le WAF : sans cela, tous les clients auraient l'IP
  # du WAF et partageraient la même limite. Confiance limitée aux réseaux Docker privés.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Real-IP;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  # En-têtes de sécurité (déclarés ici seulement : aucun add_header dans les locations)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  proxy_connect_timeout 3s;
  proxy_read_timeout 10s;
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # --- API (le navigateur ne connaît que /api, jamais les services) ---------
  location = /api/auth/token {
    limit_req zone=login burst=5 nodelay;
    limit_except POST { deny all; }
    set $auth_host auth-service;
    proxy_pass http://$auth_host:8000/auth/token;
  }

  location ~ ^/api/(transactions|accounts)(/[A-Za-z0-9-]+)?$ {
    limit_req zone=api burst=20 nodelay;
    set $payment_host payment-api;
    proxy_pass http://$payment_host:8000/$1$2;
  }

  location /api/ {
    return 404;
  }

  # --- Pages de l'application (liste identique à src/routes.js) --------------
  location ~ ^/(confidentialite|cgu)?/?$ {
    expires -1;
    try_files /index.html =404;
  }

  # Fichiers générés par Vite : noms avec empreinte, cache long
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires 1h;
    try_files $uri =404;
  }

  # Vraie page 404 (code HTTP 404, pas une page d'accueil déguisée)
  error_page 404 /404.html;
  location = /404.html {
    internal;
    expires -1;
  }
}
